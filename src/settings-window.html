<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pane の設定</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<script>
  // index.htmlと同じ起動時スクリプト: OSのダーク/ライト設定を即座に反映しておき、
  // 「settings」応答(実際の保存済みテーマ)が届くまでの一瞬だけ違う配色が出る
  // ちらつきを防ぐ。実際のテーマ(手動選択・プリセット)はsettings-entry.jsが
  // ブリッジからの応答を受けて上書きする。
  try {
    var dark = matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  } catch (e) {}
</script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="themes.css">
<style>
  /* 設定画面専用ウィンドウ: 本文エディタ・メニューバー・ステータスバーは持たず、
     ウィンドウの中身はsettings-entry.jsが描画する設定画面(pageモード)だけで占める。 */
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
</style>
</head>
<body>
  <script type="module" src="settings-entry.js"></script>
</body>
</html>
