<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Pane - カスタムCSSを作る</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<script>
  // index.html/settings-window.html と同じ起動時スクリプト(白フラッシュ対策)。C#側
  // (Pane/CssEditorWindow.cs)が保存済みのテーマを data-theme に先に入れている。無ければOS設定。
  try {
    if (!document.documentElement.dataset.theme) {
      var dark = matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    }
  } catch (e) {}
</script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="themes.css">
<style>
  /* カスタムCSSの作成補助(仕様書 第2.10.1節 C-16)。上に操作の帯、下に「左: 入力欄とCSS編集欄 /
     右: 見本」を並べる。色とフォントは既存のトークンだけを使う(CLAUDE.md「見た目」)。
     編集中のカスタムCSSはこの画面には当てない(見本の iframe の中だけに当てる)。 */
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 13px; overflow: hidden; }
  .ce-bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--rule); background: var(--chrome-bg); flex: none; }
  .ce-title { font-family: var(--font-heading); font-weight: 600; font-size: 14px; white-space: nowrap; }
  .ce-target { flex: 1; min-width: 0; color: var(--ink-mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ce-seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .ce-seg button { border: none; background: var(--surface); color: var(--ink); font: inherit; padding: 4px 12px; cursor: pointer; }
  .ce-seg button + button { border-left: 1px solid var(--line); }
  .ce-seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
  .ce-notice { padding: 6px 12px; border-bottom: 1px solid var(--rule); color: var(--ink-sub); background: var(--panel-bg); flex: none; }
  .ce-notice.error { color: var(--danger); }
  .ce-notice[hidden] { display: none; }
  .ce-main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(340px, 38%) 1fr; }
  .ce-left { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--rule); }
  .ce-form { flex: none; max-height: 48%; overflow-y: auto; padding: 8px 12px 10px; border-bottom: 1px solid var(--rule); }
  .ce-group-title { font-weight: 600; margin: 10px 0 6px; color: var(--ink-sub); }
  .ce-group-title:first-child { margin-top: 4px; }
  .ce-row { display: grid; grid-template-columns: 11em 22px 1fr 22px; align-items: center; gap: 6px; margin: 4px 0; }
  .ce-row label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ce-row input { min-width: 0; font: inherit; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--input-bg); color: var(--ink); }
  .ce-row input::placeholder { color: var(--ink-mute); }
  .ce-swatch { width: 22px; height: 22px; border: 1px solid var(--line); border-radius: 6px; padding: 0; cursor: pointer; background: var(--cp-checker, var(--surface)); position: relative; overflow: hidden; }
  .ce-swatch span { position: absolute; inset: 0; }
  .ce-row.font { grid-template-columns: 11em 1fr 22px; }
  .ce-reset { width: 22px; height: 22px; border: none; background: transparent; color: var(--ink-mute); cursor: pointer; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; }
  .ce-reset:hover { background: var(--accent-soft); color: var(--ink); }
  .ce-reset[disabled] { visibility: hidden; }
  .ce-help { color: var(--ink-mute); margin: 10px 0 2px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ce-code { flex: 1; min-height: 0; position: relative; }
  .ce-code .cm-editor { height: 100%; }
  .ce-code .cm-scroller { font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6; }
  .ce-preview { width: 100%; height: 100%; border: none; display: block; background: var(--paper); }
</style>
</head>
<body>
  <script type="module" src="css-editor-entry.js"></script>
</body>
</html>
