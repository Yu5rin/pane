<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pane</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<script>
  try {
    var dark = matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "dark" : "light";
  } catch (e) {}
</script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="themes.css">
<style>
  /* 第10.4節の画面構成: メニューバー・本文(#main-area)・ステータスバーの三段。
     本文はサイドバー(#sidebar)と編集領域(#cm-host)の横並び(第2.8節)。
     (タイトル・ダーティ表示・読み取り専用表示はOSネイティブのウィンドウタイトルが兼ねるため、
     HTML側の専用タイトルバー行は持たない)。 */
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font-family: var(--font-body); position: relative; }
  /* #main-area: サイドバー(#sidebar)と本文(#cm-host)を横並びにする行(第2.8節・第10.4節)。
     サイドバーの開閉スタイル自体はstyle.css側にまとめる。 */
  #main-area { flex: 1; min-height: 0; display: flex; }
  #cm-host { flex: 1; min-height: 0; overflow: hidden; position: relative; }
  #statusbar { display: flex; gap: 16px; padding: 0 10px; height: 24px; align-items: center; border-top: 1px solid var(--rule); font-size: 11px; color: var(--ink-mute); flex: none; font-family: var(--font-mono); }
  #statusbar button { border: none; background: transparent; color: inherit; font: inherit; cursor: pointer; padding: 0 4px; }
  #statusbar button:hover { color: var(--ink); }
</style>
</head>
<body>
  <div id="menubar">
    <span style="flex:1"></span>
    <button id="btn-theme" class="menu-theme-btn" type="button" title="テーマ切替" aria-label="テーマ切替">
      <svg id="theme-icon-light" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8 6 18M18 6l1.8-1.8"/></svg>
      <svg id="theme-icon-dark" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
    </button>
  </div>
  <div id="main-area">
    <div id="sidebar" class="collapsed">
      <div class="sidebar-tabs">
        <button type="button" class="sidebar-tab" data-panel="outline" title="アウトライン">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h13"/></svg>
        </button>
        <button type="button" class="sidebar-tab" data-panel="files" title="ファイル">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg>
        </button>
        <button type="button" class="sidebar-tab" data-panel="tree" title="ファイルツリー">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4v16M5 8h5M5 13h5M5 18h5"/><rect x="12" y="6" width="7" height="4" rx="1"/><rect x="12" y="15" width="7" height="4" rx="1"/></svg>
        </button>
      </div>
      <div class="sidebar-body" id="sidebar-body"></div>
    </div>
    <div id="cm-host"></div>
  </div>
  <div id="statusbar">
    <button id="status-sidebar" type="button" title="サイドバーの表示切替 (Ctrl+Shift+L)" aria-label="サイドバーの表示切替">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
    </button>
    <button id="status-mode" type="button" title="クリックでコードモードの言語を選択">Markdown</button>
    <span id="status-position">行 1, 列 1</span>
    <span id="status-encoding"></span>
    <span id="status-line-ending"></span>
    <button id="status-wrap" type="button" title="折り返し表示を切り替え"></button>
    <button id="status-count" type="button" title="クリックで文字数の詳細を表示">0文字</button>
    <button id="status-zoom" type="button" title="クリックで実際のサイズに戻す">100%</button>
    <span style="flex:1"></span>
    <button id="btn-settings" type="button" title="設定 (Ctrl+,)">設定</button>
  </div>
  <!-- 内容からの編集モード自動判定(仕様書 第1章の拡張)の通知バナー。モーダルにはしない
       (常時ステータスバー付近に浮かぶだけで、入力の邪魔をしない)。main.jsが表示/文言/
       ボタンを制御する。 -->
  <div id="ad-banner" class="ad-banner" hidden>
    <span id="ad-banner-text"></span>
    <button id="ad-banner-action" type="button" class="ad-banner-btn ad-banner-action" hidden></button>
    <button id="ad-banner-close" type="button" class="ad-banner-btn ad-banner-close" title="閉じる" aria-label="閉じる">閉じる</button>
  </div>
  <input id="file-input" type="file" accept=".md,.markdown,.mdown,.txt" hidden>
  <input id="image-input" type="file" accept="image/*" hidden>
  <script type="module" src="main.js"></script>
</body>
</html>
