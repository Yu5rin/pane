<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 文書中の`https://`画像・iframeは表示のためその場でURLへ読み込みリクエストが発生する
     (仕様上の割り切り。docs/仕様書.md「オンライン画像のローカル保存」非対応の項、
     docs/取扱説明書.md「外部通信について」参照)。既定のままだとRefererヘッダーに
     このアプリのオリジン(https://pane.local/)が付き、参照先へ「Paneで開かれたこと」が
     伝わってしまう(.review-security.md C-5)。Refererを一切送らないことで、その分だけでも
     参照先が得られる情報を減らす。 -->
<meta name="referrer" content="no-referrer">
<title>Pane</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<script>
  try {
    // 起動時の白(黒)フラッシュ対策(実機不具合の修正): C#側(Pane/MainForm.cs OnLoadAsync)が
    // AddScriptToExecuteOnDocumentCreatedAsyncで、保存されているテーマ設定に基づく
    // data-theme属性をこのスクリプトより先に設定している(ブリッジ経由でPaneアプリとして
    // 動いている場合)。それが既に付いていればOS設定より優先して尊重し、無い場合
    // (C#側からの注入が無いブラウザ単体検証時など)だけOS設定(prefers-color-scheme)へ
    // フォールバックする。ここを「常にOS設定で上書き」にすると、保存済みテーマがOS設定と
    // 異なる場合に一瞬OS設定側の配色が見えてから正しいテーマへ切り替わるチラつきが起きる。
    if (!document.documentElement.dataset.theme) {
      var dark = matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    }
  } catch (e) {}
</script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="themes.css">
<style>
  /* 第10.4節の画面構成: メニューバー・本文(#main-area)・ステータスバーの三段。
     本文はサイドバー(#sidebar)と編集領域(#cm-host)の横並び(第2.8節)。
     (タイトル・ダーティ表示・読み取り専用表示はOSネイティブのウィンドウタイトルが兼ねるため、
     HTML側の専用タイトルバー行は持たない)。 */
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font-family: var(--font-body); position: relative; }
  /* #main-area: サイドバー(#sidebar)と本文(#cm-host)を横並びにする行(第2.8節・第10.4節)。
     サイドバーの開閉スタイル自体はstyle.css側にまとめる。 */
  #main-area { flex: 1; min-height: 0; display: flex; }
  #cm-host { flex: 1; min-height: 0; overflow: hidden; position: relative; }
  /* overflow: hidden は、幅が狭くて全項目が収まらないとき(main.js側のResizeObserverが
     優先度の低い項目から短縮・非表示にする前の一瞬や、フォント環境差などで再計算が
     間に合わなかった場合の保険)にstatusbarの外へはみ出させないための保険。 */
  /* UI点検(.review-ui.md 指摘3)の修正: 文字色は従来var(--ink-mute)(本文の--paper上で
     調整された補助文字色)を直接使っていたが、背景のvar(--chrome-bg)は「本文より濃い」
     という別の設計方針の色(src/style.css :rootブロックのコメント参照)のため、5テーマ
     (既定ライト/sepia/solarized-light/solarized-dark/night)でAA(4.5:1)未満だった。
     バー専用の文字色var(--chrome-fg)(src/style.css・src/themes.css)に差し替える。 */
  #statusbar { display: flex; gap: 16px; padding: 0 10px; height: 24px; align-items: center; border-top: 1px solid var(--rule); font-size: 11px; color: var(--chrome-fg); flex: none; font-family: var(--font-mono); overflow: hidden; background: var(--chrome-bg); }
  /* 実機不具合の修正: 幅を狭めたとき各項目が縮んでテキストが1〜2文字ずつ折り返し、
     height:24pxを超えて縦に伸び、本文エリアに被っていた。原因はflex-shrinkが既定値の
     ままで、white-space:nowrapも無かったこと。nowrap+flex:noneで「そもそも縮んで
     折り返さない」ようにし、それでも全項目の合計幅がstatusbarに収まらない場合は
     main.js側(ResizeObserver)が優先度の低い項目から短縮・非表示にすることで対処する。 */
  #statusbar > * { white-space: nowrap; flex: none; }
  /* min-heightを明示するのは、#status-encoding/#status-line-endingのように文書を開くまで
     textContentが空になるボタンが、内容が空のあいだ高さ0になってクリックできなくなるのを防ぐため
     (line-heightだけでは中身が空のテキストノードに行ボックスが生成されず効かないため、
     min-heightでボタン自体の高さをstatusbarの行の高さぶん確保する)。 */
  #statusbar button { border: none; background: transparent; color: inherit; font: inherit; cursor: pointer; padding: 0 4px; min-height: 20px; }
  #statusbar button:hover { color: var(--ink); }
</style>
</head>
<body>
  <div id="menubar">
    <span style="flex:1"></span>
    <button id="btn-theme" class="menu-theme-btn" type="button" title="テーマ切替" aria-label="テーマ切替">
      <svg id="theme-icon-light" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8 6 18M18 6l1.8-1.8"/></svg>
      <svg id="theme-icon-dark" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
    </button>
    <!-- メニューバー右端の残り2つ: 設定・ヘルプ(Graftと同じ並び)。クリック時の配線は
         src/commands.js の initMenuBar が行う(main.jsが持つctx.commands/ctx.actionsを使うため)。 -->
    <button id="btn-menu-settings" class="menu-theme-btn" type="button" title="設定 (Ctrl+,)" aria-label="設定">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.5 7.5 0 0 0 0-2l1.9-1.4-2-3.4-2.2.6a7.6 7.6 0 0 0-1.7-1L14.9 3.5h-4l-.5 2.3a7.6 7.6 0 0 0-1.7 1l-2.2-.6-2 3.4L6.4 11a7.5 7.5 0 0 0 0 2l-1.9 1.4 2 3.4 2.2-.6a7.6 7.6 0 0 0 1.7 1l.5 2.3h4l.5-2.3a7.6 7.6 0 0 0 1.7-1l2.2.6 2-3.4z"/></svg>
    </button>
    <button id="btn-menu-help" class="menu-theme-btn" type="button" title="ヘルプ" aria-label="ヘルプ">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.3 9.2a2.7 2.7 0 1 1 4.4 2.1c-.9.7-1.7 1.2-1.7 2.4"/><circle cx="12" cy="17" r="1" fill="currentColor" stroke="none"/></svg>
    </button>
  </div>
  <!-- タブバー(仕様書 第2.10節 C-14、隠し設定): displayMode==="tab"のときだけmain.js側が
       hiddenを外して表示する。既定(window形式)では常に非表示・空のまま(main.js参照)。 -->
  <div id="tabbar" class="tabbar" role="tablist" hidden>
    <div id="tabbar-list" class="tabbar-list"></div>
    <button id="tabbar-new" class="tabbar-new-btn" type="button" title="新しいタブ" aria-label="新しいタブ">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
  <div id="main-area">
    <div id="sidebar" class="collapsed">
      <div class="sidebar-tabs">
        <button type="button" class="sidebar-tab" data-panel="outline" data-tip="sidebar-tab-outline" title="アウトライン">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h13"/></svg>
        </button>
        <button type="button" class="sidebar-tab" data-panel="files" data-tip="sidebar-tab-files" title="ファイルリスト">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg>
        </button>
        <button type="button" class="sidebar-tab" data-panel="tree" data-tip="sidebar-tab-tree" title="ファイルツリー">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4v16M5 8h5M5 13h5M5 18h5"/><rect x="12" y="6" width="7" height="4" rx="1"/><rect x="12" y="15" width="7" height="4" rx="1"/></svg>
        </button>
      </div>
      <div class="sidebar-body" id="sidebar-body"></div>
      <!-- サイドバー幅のリサイズハンドル(ドラッグで変更、ダブルクリックで既定幅に戻す)。
           実際の処理はsrc/sidebar.js側で配線する。 -->
      <div id="sidebar-resize-handle" class="sidebar-resize-handle" title="ドラッグでサイドバーの幅を変更(ダブルクリックで既定幅に戻す)"></div>
    </div>
    <div id="cm-host"></div>
  </div>
  <div id="statusbar">
    <button id="status-sidebar" type="button" title="サイドバーの表示切替 (Ctrl+Shift+L)" aria-label="サイドバーの表示切替">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
    </button>
    <button id="status-mode" type="button" title="クリックでコードモードの言語を選択">Markdown</button>
    <span id="status-position">行 1, 列 1</span>
    <button id="status-encoding" type="button" title="クリックで文字コードを変更"></button>
    <button id="status-line-ending" type="button" title="クリックで改行コードを変更"></button>
    <button id="status-wrap" type="button" title="折り返し表示を切り替え"></button>
    <button id="status-count" type="button" title="クリックで文字数の詳細を表示">0文字</button>
    <button id="status-zoom" type="button" title="クリックで実際のサイズに戻す">100%</button>
    <span style="flex:1"></span>
    <!-- 未保存の変更があることを文字で示す(タイトルバーの"(未保存)"と対になる表示)。 -->
    <span id="status-dirty" hidden>未保存</span>
  </div>
  <!-- 内容からの編集モード自動判定(仕様書 第1章の拡張)の通知バナー。モーダルにはしない
       (常時ステータスバー付近に浮かぶだけで、入力の邪魔をしない)。main.jsが表示/文言/
       ボタンを制御する。 -->
  <div id="ad-banner" class="ad-banner" hidden>
    <span id="ad-banner-text"></span>
    <button id="ad-banner-action" type="button" class="ad-banner-btn ad-banner-action" hidden></button>
    <button id="ad-banner-close" type="button" class="ad-banner-btn ad-banner-close" title="閉じる" aria-label="閉じる">閉じる</button>
  </div>
  <input id="file-input" type="file" accept=".md,.markdown,.mdown,.txt" hidden>
  <input id="image-input" type="file" accept="image/*" hidden>
  <script type="module" src="main.js"></script>
</body>
</html>
